name: Build Futurism APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p android-app/app/src/main/java/com/futurism/app
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/xml
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/assets/icons

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FuturismAndroid"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.futurism.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.futurism.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:label="Futurism"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">

                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />

                  </provider>

              </application>

          </manifest>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F3EE</item>
                  <item name="android:navigationBarColor">#F7F3EE</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="camera"
                  path="camera/" />
          </paths>
          EOF

          cat > android-app/app/src/main/java/com/futurism/app/MainActivity.java <<'EOF'
          package com.futurism.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int CAMERA_PERMISSION_REQUEST = 1002;
              private static final int CREATE_FILE_REQUEST = 1003;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private Uri cameraUri;

              private String pendingFileContent = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  window.setStatusBarColor(Color.rgb(247, 243, 238));
                  window.setNavigationBarColor(Color.rgb(247, 243, 238));

                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      window.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                              View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }

                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(true);
                  }

                  webView = new WebView(this);
                  webView.setFitsSystemWindows(true);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "Android"
                  );

                  webView.setWebViewClient(
                          new WebViewClient()
                  );

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView webView,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams fileChooserParams) {

                                  if (MainActivity.this.filePathCallback != null) {
                                      MainActivity.this.filePathCallback.onReceiveValue(null);
                                  }

                                  MainActivity.this.filePathCallback = callback;

                                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                                          checkSelfPermission(
                                                  Manifest.permission.CAMERA
                                          ) != PackageManager.PERMISSION_GRANTED) {

                                      requestPermissions(
                                              new String[]{
                                                      Manifest.permission.CAMERA
                                              },
                                              CAMERA_PERMISSION_REQUEST
                                      );

                                      return true;
                                  }

                                  openFileChooser();

                                  return true;
                              }
                          }
                  );

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              private void openFileChooser() {

                  Intent cameraIntent =
                          new Intent(MediaStore.ACTION_IMAGE_CAPTURE);

                  try {

                      File cameraDir =
                              new File(getCacheDir(), "camera");

                      if (!cameraDir.exists()) {
                          cameraDir.mkdirs();
                      }

                      File photoFile =
                              File.createTempFile(
                                      "futurism_",
                                      ".jpg",
                                      cameraDir
                              );

                      cameraUri =
                              FileProvider.getUriForFile(
                                      this,
                                      getPackageName()
                                              + ".fileprovider",
                                      photoFile
                              );

                      cameraIntent.putExtra(
                              MediaStore.EXTRA_OUTPUT,
                              cameraUri
                      );

                      cameraIntent.addFlags(
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                      );

                  } catch (IOException e) {
                      cameraIntent = null;
                  }

                  Intent galleryIntent =
                          new Intent(Intent.ACTION_OPEN_DOCUMENT);

                  galleryIntent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  galleryIntent.setType("image/*");

                  Intent chooser;

                  if (cameraIntent != null &&
                          cameraIntent.resolveActivity(
                                  getPackageManager()
                          ) != null) {

                      chooser =
                              Intent.createChooser(
                                      galleryIntent,
                                      "选择照片或拍摄照片"
                              );

                      chooser.putExtra(
                              Intent.EXTRA_INITIAL_INTENTS,
                              new Intent[]{cameraIntent}
                      );

                  } else {

                      chooser =
                              Intent.createChooser(
                                      galleryIntent,
                                      "选择照片"
                              );
                  }

                  try {

                      startActivityForResult(
                              chooser,
                              FILE_CHOOSER_REQUEST
                      );

                  } catch (ActivityNotFoundException e) {

                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(null);
                          filePathCallback = null;
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode ==
                          CAMERA_PERMISSION_REQUEST) {

                      if (grantResults.length > 0 &&
                              grantResults[0] ==
                                      PackageManager.PERMISSION_GRANTED) {

                          openFileChooser();

                      } else {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                              filePathCallback = null;
                          }
                      }
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode ==
                          FILE_CHOOSER_REQUEST) {

                      if (filePathCallback == null) {
                          return;
                      }

                      Uri[] results = null;

                      if (resultCode == RESULT_OK) {

                          if (data != null &&
                                  data.getData() != null) {

                              results = new Uri[]{
                                      data.getData()
                              };

                          } else if (cameraUri != null) {

                              results = new Uri[]{
                                      cameraUri
                              };
                          }
                      }

                      filePathCallback.onReceiveValue(
                              results
                      );

                      filePathCallback = null;
                      cameraUri = null;
                  }

                  if (requestCode ==
                          CREATE_FILE_REQUEST) {

                      if (resultCode == RESULT_OK &&
                              data != null &&
                              data.getData() != null &&
                              pendingFileContent != null) {

                          try {

                              Uri uri = data.getData();

                              java.io.OutputStream output =
                                      getContentResolver()
                                              .openOutputStream(uri);

                              if (output != null) {

                                  output.write(
                                          pendingFileContent
                                                  .getBytes("UTF-8")
                                  );

                                  output.flush();
                                  output.close();
                              }

                          } catch (Exception ignored) {
                          }
                      }

                      pendingFileContent = null;
                  }
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void saveFile(
                          String filename,
                          String content) {

                      runOnUiThread(() -> {

                          pendingFileContent = content;

                          Intent intent =
                                  new Intent(
                                          Intent.ACTION_CREATE_DOCUMENT
                                  );

                          intent.addCategory(
                                  Intent.CATEGORY_OPENABLE
                          );

                          intent.setType(
                                  "application/json"
                          );

                          intent.putExtra(
                                  Intent.EXTRA_TITLE,
                                  filename
                          );

                          startActivityForResult(
                                  intent,
                                  CREATE_FILE_REQUEST
                          );
                      });
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Copy Futurism web files
        run: |
          cp index.html android-app/app/src/main/assets/index.html

          if [ -f manifest.json ]; then
            cp manifest.json android-app/app/src/main/assets/manifest.json
          fi

          if [ -f sw.js ]; then
            cp sw.js android-app/app/src/main/assets/sw.js
          fi

          if [ -d icons ]; then
            cp -r icons/* android-app/app/src/main/assets/icons/ || true
          fi

      - name: Prepare launcher icon
        run: |
          ICON=""

          if [ -f "icon-192.png" ]; then
            ICON="icon-192.png"
          elif [ -f "icons/icon-192.png" ]; then
            ICON="icons/icon-192.png"
          fi

          if [ -n "$ICON" ]; then
            cp "$ICON" android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON" android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON" android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON" android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON" android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Create Gradle wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        working-directory: android-app
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futurism-APK-v1.3
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
