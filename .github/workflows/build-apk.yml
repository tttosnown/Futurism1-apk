name: Build Futurism APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/futurism/app
          mkdir -p app/src/main/assets

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FuturismAPK"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.futurism.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.futurism.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Futurism"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#000000</item>

                  <item name="android:statusBarColor">#F7F3EE</item>
                  <item name="android:navigationBarColor">#F7F3EE</item>

                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/futurism/app/MainActivity.java <<'EOF'
          package com.futurism.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  window.setStatusBarColor(Color.rgb(247, 243, 238));
                  window.setNavigationBarColor(Color.rgb(247, 243, 238));

                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      window.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                              View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }

                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(true);
                  }

                  webView = new WebView(this);
                  webView.setFitsSystemWindows(true);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      # =========================
      # 处理 Futurism 图标
      # =========================

      - name: Prepare Futurism launcher icon
        shell: bash
        run: |
          if [ ! -f icon-192.png ]; then
            echo "ERROR: icon-192.png not found"
            exit 1
          fi

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("icon-192.png")

          img = Image.open(src).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():

              # 保持原图比例
              scale = min(size / img.width, size / img.height)

              new_w = int(img.width * scale)
              new_h = int(img.height * scale)

              resized = img.resize(
                  (new_w, new_h),
                  Image.Resampling.LANCZOS
              )

              canvas = Image.new(
                  "RGBA",
                  (size, size),
                  (255, 255, 255, 0)
              )

              x = (size - new_w) // 2
              y = (size - new_h) // 2

              canvas.alpha_composite(resized, (x, y))

              canvas.save(
                  f"app/src/main/res/mipmap-{density}/ic_launcher.png"
              )

          # Android 8+ 自适应图标前景
          foreground = img.resize(
              (432, 432),
              Image.Resampling.LANCZOS
          )

          foreground.save(
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
          )
          PY

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="icon_background">#F2F2F7</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <solid android:color="#F2F2F7"/>

          </shape>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background android:drawable="@drawable/ic_launcher_background"/>

              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>

          </adaptive-icon>
          EOF

      # =========================
      # 复制 Futurism 网页文件
      # =========================

      - name: Copy Futurism files
        shell: bash
        run: |
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "ERROR: index.html not found"
            exit 1
          fi

          # 所有 JS 文件全部复制进去
          find . -maxdepth 1 -type f -name "*.js" -exec cp {} app/src/main/assets/ \;

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest app/src/main/assets/
          fi

          if [ -f sw.js ]; then
            cp sw.js app/src/main/assets/
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png app/src/main/assets/
          fi

          if [ -f icon-180.png ]; then
            cp icon-180.png app/src/main/assets/
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png app/src/main/assets/
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futurism-APK-v1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
